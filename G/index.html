<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Links</title>
        <!-- meta data -->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel = "stylesheet" href="style.css"/>
        <link rel="icon" type="image/x-icon" href="images/Menu/SVG/G-Logo-B&W.svg">
        <script>
            function myFunction() {
            // Get the text field
            var copyText = document.getElementById("myInput");

            // Select the text field
            copyText.select();
            copyText.setSelectionRange(0, 99999); // For mobile devices

            // Copy the text inside the text field
            navigator.clipboard.writeText(copyText.value);
            
            // Alert the copied text
            alert("Copied the text: " + copyText.value);
            }
        </script>
    </head>
    <body>
        <div class="content">
            <a class="button" href="https://gianmp22.github.io/G_Portfolio/index.html" target="_blank">
                <img src="images/Menu/SVG/G-Logo-B.svg" alt="G icon.">
                Website
            </a>
            <a class="button" href="https://www.linkedin.com/in/gian-morris-perez-697453268/" target="_blank">
                <img src="images/Menu/SVG/LinkedIn_icon.svg" alt="Linkedin icon.">
                LinkedIn
            </a>
            <a class="button" href="https://www.instagram.com/gianmorrisperez/" target="_blank">
                <img src="images/Menu/Instagram-Icon.png" alt="Instagram icon.">
                Instagram
            </a>
            <input type="text" hidden value="gmmp1212@gmail.com" id="myInput">
            <button class="button" onclick="myFunction()">
                <img src="images/Menu/Gmail_icon_(2020).svg.png" alt="Emain icon.">
                Email
            </button>
            <!-- <a href="mailto:gmmp1212@gmail.com" target="_blank">
                <img src="images/Menu/Gmail_icon_(2020).svg.png" alt="Emain icon.">
                Email
            </a> -->
        </div>
    </body>
</html>
